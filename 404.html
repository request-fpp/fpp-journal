<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Журнал FPP</title><style>
:root{--ink:#1d2b3a;--muted:#5b6b7c;--line:#e3e8ee;--bg:#fff;--accent:#c8102e}
@media (prefers-color-scheme:dark){:root{--ink:#e6ebf0;--muted:#9fb0c2;--line:#2c3a48;--bg:#121a22}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:24px 16px 64px}h1{font-size:28px;margin:0 0 4px}
h2{font-size:20px;margin:32px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
a{color:var(--accent)}code{font-size:15px;background:rgba(127,127,127,.15);padding:1px 5px;border-radius:4px}
li{margin:4px 0}.stamp{color:var(--muted);font-size:14px;margin:0 0 16px}
table{display:block;overflow-x:auto;border-collapse:collapse;font-size:14px;line-height:1.35;margin:12px 0}
th,td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{position:sticky;top:0;background:var(--bg)}
</style></head><body><main><p class="stamp">Опубликовано 05.10.2026 22:06</p><h1>Такой страницы в журнале нет</h1><p>Адрес написан с ошибкой или страница не публиковалась. <a href="/">Открыть журнал</a>.</p></main></body></html>
